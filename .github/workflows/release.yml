name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux x86_64 binary
    runs-on: ubuntu-latest
    env:
      # Fixed SA test password, deliberately not a secret; chosen here and
      # reused verbatim by the CONTRIBUTING.md one-liner and the
      # DATA_SPARK_TEST_MSSQL_* test defaults as later slices land them
      # (ADR-0066). Upper+lower+digit satisfies SQL Server's complexity
      # policy with no shell-special characters.
      MSSQL_SA_PASSWORD: DataSparkTest123
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start SQL Server container
        # Detached start right after checkout so the server boots behind
        # toolchain install, cache restore, fmt, and clippy; the readiness
        # wait sits immediately before the test step. Measured on the
        # public runner: 14 s pull + 5 s startup, ~2 GB disk (spike run
        # 31091458338; the root filesystem has 145 GB), so no disk-free
        # accommodation is needed. The image floats 2022-latest as a
        # single version (ADR-0066): no version matrix, no CU pin; if a
        # cumulative update ever breaks CI, pin that CU and report
        # upstream.
        run: |
          docker run -d --name mssql -p 1433:1433 \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Free runner disk space
        # The bundled DuckDB engine plus per-target debug info makes the
        # build tree large enough to exhaust the default runner disk while
        # linking the integration-test binaries (ENOSPC, then ld bus
        # errors). Dropping preinstalled toolchains this job never uses
        # frees ~20 GiB without touching the Rust build cache or any
        # fingerprint.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Rust build artifacts
        # Restore-only consumer of the caches ci.yml saves on pushes to main;
        # shared-key must equal the ci.yml job id (rust) to address those caches.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          save-if: "false"

      - name: Validate tag and Cargo version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease; got $tag" >&2
            exit 1
          fi

          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml version $cargo_version does not match tag $tag" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Wait for SQL Server readiness
        # Bounded probe loop so a server that never comes up fails the job
        # loudly here — with the container log for diagnosis — instead of
        # hanging until the job timeout. On warm-cache runs the server has
        # been up for minutes by now and the first probe succeeds, so the
        # net wall-clock cost approaches zero (ADR-0066).
        run: |
          set -euo pipefail

          attempts=60
          interval=2
          for attempt in $(seq 1 "$attempts"); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C \
              -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
              -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server ready after $attempt probe(s)"
              exit 0
            fi
            sleep "$interval"
          done

          echo "SQL Server did not become ready after $attempts probes" >&2
          docker logs --tail 50 mssql >&2 || true
          exit 1

      - name: Run tests
        # --include-ignored runs the #[ignore = "needs SQL Server"] gated
        # tests alongside the rest of the suite (ADR-0066). The repo
        # reserves #[ignore] for needs-a-live-server tests, so the flag's
        # scope is exactly the server-backed suite.
        run: cargo test --locked -- --include-ignored

      - name: Build release binary
        run: cargo build --release --locked --bin data-spark

      - name: Prepare binary asset
        run: |
          set -euo pipefail

          mkdir -p dist
          cp target/release/data-spark dist/data-spark-linux-x86_64
          strip dist/data-spark-linux-x86_64
          chmod +x dist/data-spark-linux-x86_64
          ./dist/data-spark-linux-x86_64 --help
          version_output="$(./dist/data-spark-linux-x86_64 --version)"
          if [ "$version_output" != "data-spark ${GITHUB_REF_NAME#v}" ]; then
            echo "Shipped binary reports '$version_output'; expected 'data-spark ${GITHUB_REF_NAME#v}'" >&2
            exit 1
          fi
          sha256sum dist/data-spark-linux-x86_64 | tee dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          checksum=$(cut -d' ' -f1 dist/SHA256SUMS)
          notes_file=$(mktemp)
          release_flags=(--title "$tag" --notes-file "$notes_file")

          if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          {
            printf 'Data Spark %s\n\n' "$tag"
            printf 'Binary asset:\n\n'
            printf '%s\n\n' '- `data-spark-linux-x86_64`'
            printf 'SHA256:\n\n'
            printf '```text\n%s  data-spark-linux-x86_64\n```\n' "$checksum"
          } > "$notes_file"

          gh release create "$tag" \
            dist/data-spark-linux-x86_64 \
            "${release_flags[@]}"
