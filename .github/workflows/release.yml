name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space
        # The bundled DuckDB engine plus per-target debug info makes the
        # build tree large enough to exhaust the default runner disk while
        # linking the integration-test binaries (ENOSPC, then ld bus
        # errors). Dropping preinstalled toolchains this job never uses
        # frees ~20 GiB without touching the Rust build cache or any
        # fingerprint.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache Rust build artifacts
        # Restore-only consumer of the caches ci.yml saves on pushes to main;
        # shared-key must equal the ci.yml job id (rust) to address those caches.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust"
          save-if: "false"

      - name: Validate tag and Cargo version
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease; got $tag" >&2
            exit 1
          fi

          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml version $cargo_version does not match tag $tag" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --bin data-spark

      - name: Prepare binary asset
        run: |
          set -euo pipefail

          mkdir -p dist
          cp target/release/data-spark dist/data-spark-linux-x86_64
          strip dist/data-spark-linux-x86_64
          chmod +x dist/data-spark-linux-x86_64
          ./dist/data-spark-linux-x86_64 --help
          version_output="$(./dist/data-spark-linux-x86_64 --version)"
          if [ "$version_output" != "data-spark ${GITHUB_REF_NAME#v}" ]; then
            echo "Shipped binary reports '$version_output'; expected 'data-spark ${GITHUB_REF_NAME#v}'" >&2
            exit 1
          fi
          sha256sum dist/data-spark-linux-x86_64 | tee dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          checksum=$(cut -d' ' -f1 dist/SHA256SUMS)
          notes_file=$(mktemp)
          release_flags=(--title "$tag" --notes-file "$notes_file")

          if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi

          {
            printf 'Data Spark %s\n\n' "$tag"
            printf 'Binary asset:\n\n'
            printf '%s\n\n' '- `data-spark-linux-x86_64`'
            printf 'SHA256:\n\n'
            printf '```text\n%s  data-spark-linux-x86_64\n```\n' "$checksum"
          } > "$notes_file"

          gh release create "$tag" \
            dist/data-spark-linux-x86_64 \
            "${release_flags[@]}"
