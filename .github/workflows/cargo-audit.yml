name: cargo-audit

on:
  schedule:
    # Weekly advisory sensor (ADR-0069). Offset from the top of the hour
    # to avoid GitHub's scheduled-load spikes.
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Serialize runs so a manual dispatch overlapping the weekly schedule cannot
# race the read-compare-report sequence or file a duplicate tracking issue.
concurrency:
  group: cargo-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        # Compiled from crates.io on every run: the job is weekly and
        # non-blocking, so a few minutes of compile time beats adding a
        # prebuilt-binary download as a new trust surface. The version
        # floats deliberately — a pinned scanner rots against the moving
        # advisory database, and a scanner break here is a loud red run,
        # never a merge-gate event.
        run: cargo install --locked cargo-audit

      - name: Audit Cargo.lock
        # Non-blocking sensor: advisory findings surface as a tracking
        # issue or comment in the next step and the run stays green, so an
        # external advisory publication never reddens main or touches the
        # merge gate (ADR-0069). Any other nonzero exit — advisory-database
        # fetch failure, tool breakage, or disagreement between terminal and
        # JSON results — fails this step instead: a broken sensor should be a
        # red run, not a misfiled findings issue. The first scan updates the
        # advisory database and preserves cargo-audit's native report; the
        # second skips that update and extracts the exact vulnerability ID set.
        run: >-
          bash .github/scripts/cargo-audit-scan.sh
          audit-report.txt audit-report.json vulnerability-ids.txt

      - name: Update the findings tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: "cargo-audit sensor: new findings on Cargo.lock"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_REPORT_PATH: audit-report.txt
          VULNERABILITY_IDS_PATH: vulnerability-ids.txt
        run: bash .github/scripts/cargo-audit-sensor.sh
