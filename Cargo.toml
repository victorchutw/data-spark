[package]
name = "data-spark"
version = "0.1.0-alpha.1"
edition = "2021"

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4.0"
parquet = "59.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
serde_json = "1.0"
tempfile = "3.10"
