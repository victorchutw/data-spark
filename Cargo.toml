[package]
name = "data-spark"
version = "0.4.0"
edition = "2021"
description = "Portable data movement CLI for turning operational data into BI-ready datasets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/victorchutw/data-spark"

[dependencies]
# The Arrow stack tracks the `duckdb` crate's `arrow ^58` pin (ADR-0030).
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
# Already in the dependency tree via arrow; used for calendar validity and
# epoch math behind the strict declared-timestamp parsers (ADR-0043).
chrono = { version = "0.4.45", default-features = false }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4.0"
duckdb = { version = "1.10504", features = ["bundled", "vtab-arrow"] }
parquet = "58.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
# SQL Server TDS client for the sqlserver connector. Pinned by full commit
# SHA to the maintainer-controlled fork (ADR-0069's fork rung, activated by
# #156): the published 0.12.3 sources plus one Numeric patch that accepts
# scale 38 and describes fraction-only values at their real precision, so
# `decimal(38,38)` loads. Same spike-proven feature set; the stale rustls
# 0.21 stack is unchanged and stays accepted with the weekly cargo-audit
# sensor carrying the ignore list. Return to crates.io once an upstream
# release carries the fix.
tiberius = { git = "https://github.com/victorchutw/tiberius", rev = "65c1a32fbc8e9c16423a76a76cdb1a800b1c21fa", default-features = false, features = ["tds73", "rustls", "chrono"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
serde_json = "1.0"
tempfile = "3.10"
