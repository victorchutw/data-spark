[package]
name = "data-spark"
version = "0.1.1-alpha.1"
edition = "2021"

[dependencies]
# The Arrow stack tracks the `duckdb` crate's `arrow ^58` pin (ADR-0030).
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4.0"
duckdb = { version = "1.10504", features = ["bundled", "vtab-arrow"] }
parquet = "58.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
serde_json = "1.0"
tempfile = "3.10"
